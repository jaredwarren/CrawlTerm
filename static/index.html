<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>CRAWL-TERM // Star Wars Terminal Emulator</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css?v=ots-fixed">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=JetBrains+Mono:wght@400;700;800&family=Newsreader:ital,opsz,wght@1,6..72,500&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Starfield Canvas -->
  <canvas id="starfield"></canvas>

  <!-- Nebula Background Glow -->
  <div class="nebula-overlay"></div>

  <!-- Opening Prologue Sequence Overlay -->
  <div id="intro-overlay" class="intro-overlay active">
    <div id="intro-blue-text" class="intro-blue-text">
      A long time ago in a terminal far, far away....
    </div>
    <div id="intro-logo" class="intro-logo">
      <h1>CRAWL<br>TERM</h1>
      <div class="intro-subtitle">EPISODE I: THE PERSPECTIVE SHELL</div>
    </div>
    <button id="skip-intro-btn" class="skip-btn">Skip Intro (Space / Click)</button>
  </div>

  <!-- 3D Perspective Terminal Viewport -->
  <main id="viewport" class="viewport">
    <div id="terminal-stage" class="terminal-stage">
      <div id="terminal-container" class="terminal-container"></div>
    </div>
  </main>

  <!-- Star Wars Console Control Deck -->
  <header id="hud-bar" class="hud-bar sw-console">
    <!-- Outer Chassis Frame Corner Bolts -->
    <div class="sw-bolt bolt-tl" aria-hidden="true"></div>
    <div class="sw-bolt bolt-tr" aria-hidden="true"></div>
    <div class="sw-bolt bolt-bl" aria-hidden="true"></div>
    <div class="sw-bolt bolt-br" aria-hidden="true"></div>

    <!-- Pinstripe Circuit Traces Line -->
    <div class="sw-pinstripe-trace" aria-hidden="true"></div>

    <!-- MODULE 1: Comm & Status Unit (Left Wing) -->
    <div class="sw-module sw-module-comm">
      <!-- Concentric Metal Greeble Socket -->
      <div class="sw-port-socket" title="Data Coupling Port" aria-hidden="true">
        <div class="sw-port-ring"></div>
        <div class="sw-port-core"></div>
      </div>

      <!-- Station Identification & Status Readout -->
      <div class="sw-station-plate">
        <div class="sw-brand-row">
          <div class="sw-status-orb">
            <span class="status-dot"></span>
          </div>
          <span class="hud-title">CRAWL-TERM</span>
          <span class="sw-aurebesh-tag">⫽ COMM-77</span>
        </div>
        <div class="sw-screen-housing">
          <div id="conn-status" class="conn-status">CONNECTING...</div>
        </div>
      </div>
    </div>

    <!-- MODULE 2: Nav / Perspective Deck -->
    <div class="sw-module sw-module-nav">
      <div class="sw-module-header">
        <span class="sw-tech-code">NAV.01</span>
        <span class="sw-module-name">PERSPECTIVE</span>
      </div>
      
      <!-- 3-Button Raised Bezel Bank -->
      <div class="sw-btn-bank">
        <button id="mode-crawl" class="hud-btn sw-deck-btn active" title="Cinematic Star Wars Crawl (24°)">
          <span class="sw-btn-indicator"></span>
          <span class="sw-btn-label">CRAWL</span>
        </button>
        <button id="mode-subtle" class="hud-btn sw-deck-btn" title="Subtle Tilt (8°)">
          <span class="sw-btn-indicator"></span>
          <span class="sw-btn-label">SUBTLE</span>
        </button>
        <button id="mode-flat" class="hud-btn sw-deck-btn" title="Standard Flat Screen (0°)">
          <span class="sw-btn-indicator"></span>
          <span class="sw-btn-label">FLAT</span>
        </button>
      </div>

      <!-- Pitch / Tilt Slider Lever -->
      <div class="sw-slider-rack">
        <div class="sw-rack-label">
          <span>PITCH</span>
          <span id="tilt-val" class="sw-readout">24°</span>
        </div>
        <input type="range" id="tilt-slider" min="0" max="36" value="24" step="1" class="hud-slider sw-console-slider">
      </div>
    </div>

    <!-- MODULE 3: Warp & Heatsink Deck -->
    <div class="sw-module sw-module-warp">
      <div class="sw-module-header">
        <span class="sw-tech-code">CHRN.02</span>
        <span class="sw-module-name">WARP RATE</span>
      </div>

      <div class="sw-slider-rack">
        <div class="sw-rack-label">
          <span>SPEED</span>
          <span id="speed-val" class="sw-readout">1.0s</span>
        </div>
        <input type="range" id="speed-slider" min="0" max="2500" value="1000" step="50" class="hud-slider sw-console-slider" title="Adjust crawl speed (0 = Instant, 1.0s = Movie Crawl, 2.5s = Very Slow)">
      </div>

      <!-- Glowing Heatsink Radiator Slats Greeble -->
      <div class="sw-heatsink" title="Thermal Radiator Slats" aria-hidden="true">
        <span class="sw-slat"></span>
        <span class="sw-slat"></span>
        <span class="sw-slat"></span>
        <span class="sw-slat"></span>
        <span class="sw-slat"></span>
        <span class="sw-slat"></span>
      </div>
    </div>

    <!-- MODULE 4: Optics & Spectrum Matrix -->
    <div class="sw-module sw-module-optics">
      <div class="sw-module-header">
        <span class="sw-tech-code">OPT.03</span>
        <span class="sw-module-name">OPTICS & KYBER</span>
      </div>

      <div class="sw-optics-row">
        <!-- Font Stepper Buttons -->
        <div class="sw-stepper-housing">
          <button id="font-dec-btn" class="hud-btn sw-step-btn" title="Decrease Font Size">−</button>
          <span id="font-size-val" class="sw-readout sw-font-readout">22px</span>
          <button id="font-inc-btn" class="hud-btn sw-step-btn" title="Increase Font Size">+</button>
        </div>

        <!-- Kyber Theme Selector -->
        <div class="sw-select-bezel">
          <select id="theme-preset" class="hud-select sw-console-select" title="Kyber Crystal Spectrum">
            <option value="classic">GOLD // TATOOINE</option>
            <option value="sith">SITH // CRIMSON</option>
            <option value="hoth">HOTH // ION BLUE</option>
            <option value="yoda">YODA // DAGOBAH</option>
          </select>
        </div>
      </div>
    </div>

    <!-- MODULE 5: Tactical Aux & Mechanical Stowing Latch -->
    <div class="sw-module sw-module-aux">
      <div class="sw-aux-grid">
        <!-- Stacked Dual Hexagonal (Honeycomb) Push Buttons -->
        <div class="sw-hex-stack">
          <button id="sound-btn" class="hud-btn sw-hex-btn" title="Toggle Audio Comm (Blaster / Fanfare)">
            <span class="btn-icon">🔇</span>
            <span class="sw-hex-text">AUDIO</span>
          </button>
          <button id="replay-btn" class="hud-btn sw-hex-btn" title="Replay Opening Sequence">
            <span class="btn-icon">🎬</span>
            <span class="sw-hex-text">HOLO</span>
          </button>
        </div>

        <!-- Tactical Screen Actions -->
        <div class="sw-action-stack">
          <button id="fullscreen-btn" class="hud-btn sw-rect-action-btn" title="Toggle Fullscreen">
            <span class="btn-icon">⛶</span>
            <span class="sw-action-label">TACTICAL</span>
          </button>
          <button id="collapse-hud-btn" class="hud-btn sw-latch-action-btn" title="Stow Console Deck">
            <span class="sw-hazard-stripes"></span>
            <span class="sw-action-label">▼ STOW</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Minimized HUD Opener / Deploy Latch -->
  <button id="expand-hud-btn" class="expand-hud-btn sw-deploy-latch hidden" title="Deploy Control Deck">
    <span class="sw-hazard-stripes mini"></span>
    <span>▲ DEPLOY CONSOLE</span>
    <span class="sw-hazard-stripes mini"></span>
  </button>

  <!-- Scripts -->
  <script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
  <script src="app.js?v=ots-fixed"></script>
</body>
</html>
